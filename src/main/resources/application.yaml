ktor:
  deployment:
    port: 8080
    host: "0.0.0.0"

  application:
    modules:
      - com.anasdev.MainKt.module

jwt:
  domain: "http://0.0.0.0:8080"
  audience: "gamestore-users"
  realm: "gamestore-app"
  secret: ${?JWT_SECRET}

google:
  webClientId: ${?GOOGLE_WEB_CLIENT_ID}

supabase:
  url: "${?SUPABASE_URL}"
  serviceKey: "${?SUPABASE_SERVICE_KEY}"

storage:
  driverClassName: "org.postgresql.Driver"
  jdbcURL: ${?DB_URL}
  user: ${?DB_USER}
  password: ${?DB_PASSWORD}
  maximumPoolSize: 10
